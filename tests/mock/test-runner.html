<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recognize Auto Liker — test suite</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         margin: 0; padding: 22px; background: #f6f8fb; color: #1d2433; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #667089; margin: 0 0 18px; }
  #summary { font-weight: 700; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
             background: #e8eef7; }
  #summary.pass { background: #dff3e6; color: #1c5c38; }
  #summary.fail { background: #fbe3e3; color: #7a2020; }
  ol { padding-left: 22px; margin: 0; }
  li { padding: 5px 0; border-bottom: 1px solid #e6eaf2; }
  .ok { color: #1c7c47; font-weight: 700; }
  .no { color: #b02a2a; font-weight: 700; }
  .why { color: #b02a2a; font-size: 13px; display: block; margin-left: 4px; }
  .ms { color: #98a1b8; font-size: 12px; }
  #stage { position: absolute; left: -10000px; top: 0; width: 620px; }
</style>
</head>
<body>
  <h1>Recognize Auto Liker — test suite</h1>
  <p class="sub">
    Runs the real engine against a mock RecognizeApp feed, in this browser.
    No Node, no npm, no server — just open this file.
  </p>
  <div id="summary">Running…</div>
  <ol id="results"></ol>

  <!-- Tests build their feeds here, off-screen but fully laid out and scrollable. -->
  <div id="stage"></div>

<script src="../../extension/content/engine.js"></script>
<script src="../../extension/content/pagination.js"></script>
<script src="mock-feed.js"></script>
<script>
(function () {
  'use strict';

  var RAL = window.RecognizeAutoLiker;
  var ID = MockFeed.id;
  var stage = document.getElementById('stage');
  var resultsEl = document.getElementById('results');
  var summaryEl = document.getElementById('summary');

  /* ------------------------------------------------------------ harness */
  var TESTS = [];
  function test(name, fn) { TESTS.push({ name: name, fn: fn }); }

  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function eq(actual, expected, msg) {
    if (actual !== expected) {
      throw new Error(msg + ' — expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
    }
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /** Fast but real timings: every code path runs, just with short waits. */
  var FAST = {
    clickDelay: 90, scrollDelay: 110, verifyTimeout: 900,
    scrollAmount: 240, maxNoNewContentAttempts: 3, maxLikesPerRun: 500, debug: false
  };

  /** Builds a fresh mock feed and an engine bound to it. */
  function setup(cfg, settings) {
    var host = document.createElement('div');
    stage.appendChild(host);
    var mock = MockFeed.build(host, cfg);
    var engine = RAL.createEngine({
      root: mock.root,
      settings: Object.assign({}, FAST, settings || {})
    });
    return { mock: mock, engine: engine, host: host };
  }

  /** Every test asserts this: no existing like may ever be removed. */
  function assertNoDamage(mock) {
    eq(mock.unlikedByAutomation.length, 0,
      'NO existing like was removed (removed: ' + JSON.stringify(mock.unlikedByAutomation) + ')');
    eq(mock.forbiddenClicks.length, 0,
      'no approved control or decoy was clicked: ' + JSON.stringify(mock.forbiddenClicks));
  }

  /* =================================================================== */
  /* THE SPEC'S REQUIRED TESTS                                            */
  /* =================================================================== */

  test('1. Unliked with 0 likes ("+") is clicked', async function () {
    var s = setup({ cards: [{ id: ID(1), liked: false, count: 0 }] });
    eq(s.mock.textOf(ID(1)), '+', 'renders a bare "+"');
    var r = await s.engine.start();
    eq(r.stats.newLikes, 1, 'it was liked');
    eq(s.mock.clicks[ID(1)], 1, 'clicked exactly once');
    eq(s.mock.snapshot()[ID(1)].method, 'delete', 'flipped to data-method="delete"');
    assertNoDamage(s.mock);
  });

  test('2. Unliked showing "+4" is clicked (count is not state)', async function () {
    var s = setup({ cards: [{ id: ID(2), liked: false, count: 4 }] });
    eq(s.mock.textOf(ID(2)), '+4', 'renders "+4" while still UNLIKED by this user');
    var r = await s.engine.start();
    eq(r.stats.newLikes, 1, 'it was liked despite the high count');
    eq(s.mock.textOf(ID(2)), '+5', 'total went 4 -> 5');
    assertNoDamage(s.mock);
  });

  test('3. Already liked showing "+1" is NOT clicked', async function () {
    var s = setup({ cards: [{ id: ID(3), liked: true, count: 0 }] });
    eq(s.mock.textOf(ID(3)), '+1', 'renders "+1" and IS liked by this user');
    var before = s.mock.snapshot()[ID(3)].href;
    var r = await s.engine.start();
    assert(!s.mock.clicks[ID(3)], 'never clicked');
    eq(r.stats.newLikes, 0, 'no new likes');
    eq(r.stats.alreadyLiked, 1, 'counted as already liked');
    eq(s.mock.snapshot()[ID(3)].href, before, 'approval id untouched');
    assertNoDamage(s.mock);
  });

  test('4. Already liked showing "+5" is NOT clicked', async function () {
    var s = setup({ cards: [{ id: ID(4), liked: true, count: 4 }] });
    eq(s.mock.textOf(ID(4)), '+5', 'renders "+5" and IS liked by this user');
    await s.engine.start();
    assert(!s.mock.clicks[ID(4)], 'never clicked');
    eq(s.mock.likedCount(), 1, 'still liked');
    assertNoDamage(s.mock);
  });

  test('5. A previously liked recognition met again is never toggled off', async function () {
    var s = setup({ cards: [
      { id: ID(5), liked: true, count: 2 },
      { id: ID(6), liked: false, count: 1 }
    ] });
    var before = s.mock.snapshot();
    await s.engine.start();                       // first pass
    var second = s.engine.start ? await RAL.createEngine({
      root: s.mock.root, settings: FAST
    }).start() : null;                            // a whole fresh engine, same feed
    var after = s.mock.snapshot();
    eq(second.stats.newLikes, 0, 'the second pass liked nothing');
    eq(after[ID(5)].href, before[ID(5)].href, 'the pre-existing like is byte-identical');
    eq(after[ID(5)].method, 'delete', 'still liked');
    eq(after[ID(6)].method, 'delete', 'the one we liked stayed liked');
    assertNoDamage(s.mock);
  });

  test('6. DOM flipping to approved just before the click prevents the click', async function () {
    var target = ID(7);
    // A long pre-click delay, so the flip lands inside it deterministically.
    var s = setup({ cards: [{ id: target, liked: false, count: 3 }] }, { clickDelay: 700 });
    var run = s.engine.start();
    await wait(120);
    eq(s.mock.makeApproved(target), true, 'the feed flipped it to approved mid-delay');
    var r = await run;
    assert(!s.mock.clicks[target], 'the re-check caught it: never clicked');
    eq(r.stats.alreadyLiked, 1, 'counted as already liked instead');
    assertNoDamage(s.mock);

    // And the gate itself rejects an approved element outright.
    var approved = s.host.querySelector('a.approval_link.approved');
    eq(RAL.isSafeToLike(approved), false, 'isSafeToLike() rejects an approved element');
    eq(RAL.safetyCheck(approved).reason, 'approved-NEVER-CLICK', 'and says why');
  });

  test('7. A recognition loaded after scrolling is detected and liked', async function () {
    var initial = [];
    for (var i = 10; i < 18; i++) initial.push({ id: ID(i), liked: false, count: i % 5 });
    var s = setup({
      cards: initial,
      batches: [[{ id: ID(90), liked: false, count: 2 }, { id: ID(91), liked: true, count: 1 }]],
      loadDelay: 120, height: 260
    });
    var r = await s.engine.start();
    eq(s.mock.batchesLoaded, 1, 'the lazy batch loaded during scrolling');
    eq(s.mock.clicks[ID(90)], 1, 'the lazily loaded unliked card was liked');
    assert(!s.mock.clicks[ID(91)], 'the lazily loaded liked card was not touched');
    eq(r.stats.newLikes, 9, 'all 9 unliked recognitions were liked');
    assertNoDamage(s.mock);
  });

  test('8. The same recognition appearing twice is clicked only once', async function () {
    var dupe = ID(20);
    var s = setup({ cards: [
      { id: dupe, liked: false, count: 1 },
      { id: ID(21), liked: false, count: 0 },
      { id: dupe, liked: false, count: 1 }     // same recognition, second card
    ] });
    var r = await s.engine.start();
    eq(s.mock.clicks[dupe], 1, 'the duplicated recognition was clicked exactly once');
    eq(r.stats.newLikes, 2, 'two distinct recognitions liked');
    assertNoDamage(s.mock);
  });

  test('9. PAUSE stops processing; RESUME continues', async function () {
    var cards = [];
    for (var i = 30; i < 60; i++) cards.push({ id: ID(i), liked: false, count: 0 });
    var s = setup({ cards: cards }, { clickDelay: 400 });
    s.engine.start();
    await wait(1400);
    assert(s.mock.totalClicks > 0, 'it was clicking before PAUSE');
    eq(s.engine.pause(), true, 'paused');
    await wait(700);                              // let the in-flight click settle
    var atPause = s.mock.totalClicks;
    await wait(1200);
    eq(s.mock.totalClicks, atPause, 'no new clicks while PAUSED');
    eq(s.engine.getState(), 'PAUSED', 'state is PAUSED');
    s.engine.resume();
    await wait(1400);
    assert(s.mock.totalClicks > atPause, 'clicking resumed');
    s.engine.stop('test cleanup');
    await s.engine.waitForIdle();
    assertNoDamage(s.mock);
  });

  test('10. STOP halts immediately and no click follows', async function () {
    var cards = [];
    for (var i = 60; i < 90; i++) cards.push({ id: ID(i), liked: false, count: 0 });
    var s = setup({ cards: cards }, { clickDelay: 400 });
    var run = s.engine.start();
    await wait(1400);
    assert(s.mock.totalClicks > 0, 'it was clicking before STOP');
    s.engine.stop('test');
    var r = await run;
    var atStop = s.mock.totalClicks;
    eq(r.reason, 'STOPPED_BY_USER', 'ended with the user-stop reason');
    eq(s.engine.getState(), 'STOPPED', 'state is STOPPED');
    await wait(1200);
    eq(s.mock.totalClicks, atStop, 'nothing was clicked after STOP');
    assert(r.stats.newLikes < 30, 'stopped before finishing the feed');
    assertNoDamage(s.mock);
  });

  test('11. Esc emergency stop halts the run', async function () {
    var cards = [];
    for (var i = 100; i < 130; i++) cards.push({ id: ID(i), liked: false, count: 0 });
    var s = setup({ cards: cards }, { clickDelay: 400 });

    // The identical capture-phase handler that content.js installs.
    function onKey(e) {
      if (e.key === 'Escape' || e.keyCode === 27) {
        if (s.engine.getState() !== 'STOPPED') s.engine.stop('Esc emergency stop');
      }
    }
    window.addEventListener('keydown', onKey, true);
    try {
      var run = s.engine.start();
      await wait(1400);
      assert(s.mock.totalClicks > 0, 'it was clicking before Esc');
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', keyCode: 27, bubbles: true }));
      var r = await run;
      var atStop = s.mock.totalClicks;
      eq(r.reason, 'STOPPED_BY_USER', 'Esc stopped the run');
      await wait(900);
      eq(s.mock.totalClicks, atStop, 'no clicks after Esc');
    } finally {
      window.removeEventListener('keydown', onKey, true);
    }
    assertNoDamage(s.mock);
  });

  test('12. A hidden document does not stop the run (background/minimised)', async function () {
    var s = setup({ cards: [
      { id: ID(140), liked: false, count: 0 },
      { id: ID(141), liked: false, count: 6 }
    ] });
    var original = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden');
    Object.defineProperty(document, 'hidden', { value: true, configurable: true });
    document.dispatchEvent(new Event('visibilitychange'));
    try {
      var r = await s.engine.start();
      eq(r.stats.newLikes, 2, 'both were liked while document.hidden was true');
    } finally {
      delete document.hidden;
      if (original) Object.defineProperty(Document.prototype, 'hidden', original);
    }
    assertNoDamage(s.mock);
  });

  /* =================================================================== */
  /* DAY 1 / DAY 2 IDEMPOTENCY — mandatory                                */
  /* =================================================================== */

  test('13. Day 1 / Day 2 idempotency: A and B are never unliked', async function () {
    var A = ID(201), B = ID(202), C = ID(203);

    // ---- DAY 1: A and B unliked, both get liked ----
    var s = setup({ cards: [
      { id: A, liked: false, count: 4 },
      { id: B, liked: false, count: 0 }
    ] });
    var day1 = await s.engine.start();
    eq(day1.stats.newLikes, 2, 'day 1 liked A and B');
    var afterDay1 = s.mock.snapshot();
    eq(afterDay1[A].method, 'delete', 'A is approved+delete');
    eq(afterDay1[B].method, 'delete', 'B is approved+delete');
    var clicksAfterDay1 = s.mock.totalClicks;

    // ---- DAY 2: A and B already approved, C is new ----
    s.mock.addCards([{ id: C, liked: false, count: 2 }]);
    var day2Engine = RAL.createEngine({ root: s.mock.root, settings: FAST });
    var day2 = await day2Engine.start();
    var afterDay2 = s.mock.snapshot();

    eq(day2.stats.newLikes, 1, 'day 2 liked exactly one recognition');
    eq(s.mock.clicks[C], 1, 'and it was C');
    eq(s.mock.clicks[A], 1, 'A was not clicked again (still 1 click, from day 1)');
    eq(s.mock.clicks[B], 1, 'B was not clicked again');
    eq(s.mock.totalClicks, clicksAfterDay1 + 1, 'exactly one new click on day 2');
    eq(afterDay2[A].href, afterDay1[A].href, 'A keeps its original approval id');
    eq(afterDay2[B].href, afterDay1[B].href, 'B keeps its original approval id');
    eq(afterDay2[A].method, 'delete', 'A is still liked');
    eq(afterDay2[B].method, 'delete', 'B is still liked');
    eq(day2.stats.alreadyLiked, 2, 'day 2 saw A and B as already liked');
    assertNoDamage(s.mock);
  });

  /* =================================================================== */
  /* ADDITIONAL SAFETY AND BEHAVIOUR                                      */
  /* =================================================================== */

  test('14. Identical "+4" text, opposite actions', async function () {
    var unlikedFour = ID(210), likedFour = ID(211);
    var s = setup({ cards: [
      { id: unlikedFour, liked: false, count: 4 },   // shows +4, NOT liked
      { id: likedFour, liked: true, count: 3 }       // shows +4, IS liked
    ] });
    eq(s.mock.textOf(unlikedFour), '+4', 'the unliked one shows +4');
    eq(s.mock.textOf(likedFour), '+4', 'the liked one shows the same +4');
    var before = s.mock.snapshot()[likedFour].href;
    var r = await s.engine.start();
    eq(s.mock.clicks[unlikedFour], 1, 'the unliked "+4" was clicked');
    assert(!s.mock.clicks[likedFour], 'the liked "+4" was NOT clicked');
    eq(s.mock.snapshot()[likedFour].href, before, 'its approval id is unchanged');
    eq(r.stats.newLikes, 1, 'exactly one new like');
    assertNoDamage(s.mock);
  });

  test('15. Decoy controls are never clicked', async function () {
    var s = setup({ cards: [{ id: ID(220), liked: false, count: 0 }] });
    await s.engine.start();
    eq(s.mock.forbiddenClicks.length, 0, 'no decoy was clicked');
    var commentDecoy = s.host.querySelector('a[data-decoy="comment"]');
    var eventDecoy = s.host.querySelector('a[data-decoy="event"]');
    assert(commentDecoy.classList.contains('unapproved'), 'comment-category decoy untouched');
    assert(eventDecoy.classList.contains('unapproved'), 'wrong-event decoy untouched');
    eq(RAL.isSafeToLike(commentDecoy), false, 'gate rejects the comment decoy');
    eq(RAL.isSafeToLike(eventDecoy), false, 'gate rejects the wrong-event decoy');
  });

  test('16. Maximum new likes is respected', async function () {
    var cards = [];
    for (var i = 230; i < 250; i++) cards.push({ id: ID(i), liked: false, count: 0 });
    var s = setup({ cards: cards }, { maxLikesPerRun: 4 });
    var r = await s.engine.start();
    eq(r.reason, 'MAX_LIKES_REACHED', 'stopped for the max-likes reason');
    eq(r.stats.newLikes, 4, 'liked exactly the configured maximum');
    eq(s.mock.totalClicks, 4, 'exactly four clicks dispatched');
    assertNoDamage(s.mock);
  });

  test('17. End of feed is detected and the run ends by itself', async function () {
    var cards = [];
    for (var i = 260; i < 272; i++) cards.push({ id: ID(i), liked: false, count: 0 });
    var s = setup({ cards: cards, height: 240 });
    var r = await s.engine.start();
    eq(r.reason, 'END_OF_FEED', 'ended with END_OF_FEED');
    eq(r.stats.newLikes, 12, 'liked everything first');
    assertNoDamage(s.mock);
  });

  test('18. A click that never registers gets one retry, then is an error', async function () {
    var broken = ID(280);
    var s = setup({ cards: [
      { id: broken, liked: false, count: 0, behavior: 'fail' },
      { id: ID(281), liked: false, count: 0 }
    ] });
    var r = await s.engine.start();
    eq(s.mock.clicks[broken], 2, 'clicked exactly twice (1 attempt + 1 retry)');
    eq(r.stats.errors, 1, 'one error recorded');
    eq(r.stats.newLikes, 1, 'the healthy one still got liked');
    eq(s.engine.failedIds().join(','), broken, 'the failing id is reported');
    assertNoDamage(s.mock);
  });

  test('19. A card that disappears mid-click does not break the run', async function () {
    var s = setup({ cards: [
      { id: ID(290), liked: false, count: 0, behavior: 'vanish' },
      { id: ID(291), liked: false, count: 0 }
    ] });
    var r = await s.engine.start();
    eq(s.mock.clicks[ID(290)], 1, 'the vanishing card was clicked once and never re-clicked');
    eq(r.stats.newLikes, 1, 'the surviving card was liked');
    assert(r.reason === 'END_OF_FEED' || r.reason === 'MAX_LIKES_REACHED', 'run completed cleanly');
    assertNoDamage(s.mock);
  });

  test('20. The gate rejects every never-click shape', function () {
    var cases = [
      ['approved class', '<a class="approval_link approved" data-category="recognition" data-event="liked" data-method="delete" href="/x/recognitions/aaa/approvals/1">+1</a>', 'approved-NEVER-CLICK'],
      ['delete method', '<a class="approval_link unapproved" data-category="recognition" data-event="liked" data-method="delete" href="/x/recognitions/bbb/approvals/2">+1</a>', 'delete-method-NEVER-CLICK'],
      ['comment category', '<a class="approval_link unapproved" data-category="comment" data-event="liked" data-method="post" href="/x/comments/c/approvals">+</a>', 'not-recognition-category'],
      ['wrong event', '<a class="approval_link unapproved" data-category="recognition" data-event="commented" data-method="post" href="/x/recognitions/ccc/approvals">+</a>', 'not-liked-event'],
      ['not an approval link', '<a class="btn unapproved" data-category="recognition" data-event="liked" data-method="post" href="/x/recognitions/ddd/approvals">+</a>', 'not-an-approval-link'],
      ['no recognition id', '<a class="approval_link unapproved" data-category="recognition" data-event="liked" data-method="post" href="/x/somewhere/else">+</a>', 'no-recognition-id-in-href'],
      ['not an anchor', '<button class="approval_link unapproved" data-category="recognition" data-event="liked" data-method="post"></button>', 'not-an-anchor']
    ];
    var holder = document.createElement('div');
    stage.appendChild(holder);
    cases.forEach(function (c) {
      holder.innerHTML = c[1];
      var el = holder.firstElementChild;
      eq(RAL.isSafeToLike(el), false, c[0] + ' is refused');
      eq(RAL.safetyCheck(el).reason, c[2], c[0] + ' reports the right reason');
    });
    // ...and the one shape that IS allowed.
    holder.innerHTML = '<a class="approval_link unapproved btn" data-category="recognition" ' +
      'data-event="liked" data-method="post" href="/x/recognitions/rglauokd/approvals?approvers_limit=5">+4</a>';
    eq(RAL.isSafeToLike(holder.firstElementChild), true, 'the documented unliked shape is allowed');
    eq(RAL.recognitionIdOf(holder.firstElementChild), 'rglauokd', 'recognition id extracted from href');
  });

  /* =================================================================== */
  /* CATCHING UP ON A FEED WITH THOUSANDS OF ALREADY-LIKED POSTS          */
  /* =================================================================== */

  test('21. Stops once caught up, without dragging in the whole history', async function () {
    // The real shape of day 2 on a 1500-post feed: a few new posts at the top,
    // then page after page of posts already liked, each loaded only if you keep
    // scrolling. The win is that those pages are never fetched at all.
    var initial = [
      { id: ID(400), liked: false, count: 2 },
      { id: ID(401), liked: false, count: 0 },
      { id: ID(402), liked: false, count: 5 }
    ];
    for (var i = 410; i < 422; i++) initial.push({ id: ID(i), liked: true, count: i % 6 });

    var batches = [];
    for (var b = 0; b < 5; b++) {
      var page = [];
      for (var j = 0; j < 10; j++) page.push({ id: ID(430 + b * 10 + j), liked: true, count: 3 });
      batches.push(page);
    }

    var s = setup({ cards: initial, batches: batches, loadDelay: 100, height: 260 },
      { stopAfterConsecutiveAlreadyLiked: 20 });
    var r = await s.engine.start();

    eq(r.reason, 'CAUGHT_UP', 'stopped because the feed is caught up');
    eq(r.stats.newLikes, 3, 'the three new recognitions were liked first');
    assert(s.mock.batchesLoaded < 5,
      'it stopped before loading the whole tail (' + s.mock.batchesLoaded + ' of 5 pages)');
    assert(r.stats.scanned < 65,
      'it never had to look at every post (' + r.stats.scanned + ')');
    assertNoDamage(s.mock);
  });

  test('22. A new post below already-liked ones resets the caught-up counter', async function () {
    var cards = [];
    for (var i = 500; i < 515; i++) cards.push({ id: ID(i), liked: true, count: 3 });
    cards.push({ id: ID(520), liked: false, count: 1 });   // buried new post
    for (var j = 530; j < 545; j++) cards.push({ id: ID(j), liked: true, count: 2 });

    var s = setup({ cards: cards, height: 260 }, { stopAfterConsecutiveAlreadyLiked: 10 });
    var r = await s.engine.start();

    eq(s.mock.clicks[ID(520)], 1, 'the buried new post was still found and liked');
    eq(r.stats.newLikes, 1, 'exactly one new like');
    assertNoDamage(s.mock);
  });

  test('23. Caught-up detection can be switched off', async function () {
    var cards = [];
    for (var i = 600; i < 640; i++) cards.push({ id: ID(i), liked: true, count: 1 });
    cards.push({ id: ID(660), liked: false, count: 0 });   // right at the bottom

    var s = setup({ cards: cards, height: 240 }, { stopAfterConsecutiveAlreadyLiked: 0 });
    var r = await s.engine.start();

    eq(r.reason, 'END_OF_FEED', 'walked the whole feed');
    eq(r.stats.scanned, 41, 'saw every recognition');
    eq(s.mock.clicks[ID(660)], 1, 'and liked the one at the very bottom');
    assertNoDamage(s.mock);
  });

  test('24. Fast-forward skims dead stretches without clicking faster', async function () {
    // A long tail of already-liked posts, loaded page by page as you scroll,
    // with one unliked post right at the very bottom. This is the stretch that
    // makes a catch-up run tedious, and the only thing fast-forward changes.
    function build() {
      var initial = [];
      for (var i = 0; i < 10; i++) initial.push({ id: ID(700 + i), liked: true, count: 2 });
      var batches = [];
      for (var b = 0; b < 4; b++) {
        var page = [];
        for (var j = 0; j < 10; j++) page.push({ id: ID(720 + b * 10 + j), liked: true, count: 3 });
        batches.push(page);
      }
      batches[3].push({ id: ID(790), liked: false, count: 1 });   // the only new one
      return { cards: initial, batches: batches, loadDelay: 80, height: 240 };
    }

    var slow = setup(build(), { fastForward: false, stopAfterConsecutiveAlreadyLiked: 0 });
    var slowRun = await slow.engine.start();

    var fast = setup(build(), {
      fastForward: true, fastForwardAfter: 1, fastForwardMultiplier: 3,
      stopAfterConsecutiveAlreadyLiked: 0
    });
    var fastRun = await fast.engine.start();

    eq(slow.mock.batchesLoaded, 4, 'the slow pass walked the whole tail');
    eq(fast.mock.batchesLoaded, 4, 'the fast pass walked it too');
    eq(slowRun.stats.newLikes, 1, 'the slow pass liked the post at the bottom');
    eq(fastRun.stats.newLikes, 1, 'the fast pass liked it as well');
    eq(fastRun.stats.scanned, slowRun.stats.scanned, 'both saw every recognition');
    // Scroll count, not wall clock: the saving is real and deterministic, while
    // millisecond timing at test-speed delays is pure noise.
    assert(fastRun.stats.scrolls < slowRun.stats.scrolls,
      'fast-forward covered the dead stretch in fewer scrolls (' +
      fastRun.stats.scrolls + ' vs ' + slowRun.stats.scrolls + ')');
    eq(fast.mock.totalClicks, slow.mock.totalClicks, 'and clicked exactly as much, no more');
    assertNoDamage(slow.mock);
    assertNoDamage(fast.mock);
  });

  /* =================================================================== */
  /* KEEPING A HUGE FEED FROM HANGING THE TAB                             */
  /* =================================================================== */

  test('27. Prunes finished cards so the DOM stops growing without limit', async function () {
    // 40 cards up front, then 12 pages of 20 - the shape that ends up with
    // thousands of nodes on a real catch-up run.
    var initial = [];
    for (var i = 0; i < 40; i++) initial.push({ id: ID(1000 + i), liked: true, count: 2 });
    var batches = [];
    for (var b = 0; b < 12; b++) {
      var page = [];
      for (var j = 0; j < 20; j++) page.push({ id: ID(1100 + b * 20 + j), liked: true, count: 1 });
      batches.push(page);
    }

    var s = setup({ cards: initial, batches: batches, loadDelay: 60, height: 240 }, {
      stopAfterConsecutiveAlreadyLiked: 0,        // walk the whole thing
      pruneProcessedCards: true, pruneWhenCardsExceed: 60, keepRecentCards: 30
    });
    var r = await s.engine.start();

    var stillInDom = s.host.querySelectorAll('li.recognition').length;
    eq(r.stats.scanned, 280, 'it saw all 280 recognitions');
    assert(r.stats.pruned > 0, 'it pruned finished cards (' + r.stats.pruned + ')');
    assert(stillInDom < 280, 'the DOM is far smaller than the feed (' + stillInDom + ' of 280)');
    assert(stillInDom <= 120, 'and stays bounded rather than growing forever (' + stillInDom + ')');
    eq(r.reason, 'END_OF_FEED', 'and it still reached the end of the feed properly');
    assertNoDamage(s.mock);
  });

  test('28. Pruning never removes an unfinished or on-screen card', async function () {
    // A new post is buried deep in the tail: pruning must not take it away
    // before it has been liked.
    var initial = [];
    for (var i = 0; i < 40; i++) initial.push({ id: ID(2000 + i), liked: true, count: 1 });
    var batches = [];
    for (var b = 0; b < 6; b++) {
      var page = [];
      for (var j = 0; j < 20; j++) page.push({ id: ID(2100 + b * 20 + j), liked: true, count: 2 });

    var s = setup({ cards: initial, batches: batches, loadDelay: 60, height: 240 }, {
      stopAfterConsecutiveAlreadyLiked: 0,
      pruneProcessedCards: true, pruneWhenCardsExceed: 50, keepRecentCards: 25
    });

    eq(s.mock.clicks[ID(2500)], 1, 'the buried new post was still found and liked');

  test('29. Pruning keeps the scroll position steady', async function () {
    var cards = [];
    for (var i = 0; i < 120; i++) cards.push({ id: ID(3000 + i), liked: true, count: 1 });
    // First pass with pruning OFF, purely to mark every card as finished with -
    // otherwise the run prunes the feed below the threshold and there is
    // nothing left for the measurement below to remove.
    var s = setup({ cards: cards, height: 240 }, {
      pruneProcessedCards: false, stopAfterConsecutiveAlreadyLiked: 0
    });
    await s.engine.start();
    eq(s.host.querySelectorAll('li.recognition').length, 120, 'all 120 cards still present');

    s.engine.updateSettings({

    });
    s.mock.root.scrollTop = Math.round(s.mock.root.scrollHeight / 2);
    await wait(50);

    var anchorBefore = s.host.querySelectorAll('li.recognition');
    var refId = anchorBefore.length
      ? anchorBefore[anchorBefore.length - 1].getAttribute('data-recognition-id') : null;
    var topBefore = refId

    var refEl = refId ? s.host.querySelector('li[data-recognition-id="' + refId + '"]') : null;
    assert(!!refEl, 'the reference card survived');
    var topAfter = refEl.getBoundingClientRect().top;
    assert(Math.abs(topAfter - topBefore) <= 4,

  test('30. Pruning can be switched off', async function () {
    var cards = [];
    for (var i = 0; i < 80; i++) cards.push({ id: ID(4000 + i), liked: true, count: 1 });
    var s = setup({ cards: cards, height: 240 }, {

    });

  test('31. A slow-loading feed is not mistaken for the end of the feed', async function () {
    // The exact failure: at the bottom of the feed, waiting for the next page.
    // Fast-forward shortens the wait, the page has not arrived yet, and each
    // short wait was counted as evidence that the feed had ended - so the run
    // died partway down with END_OF_FEED.
    var initial = [];
    for (var i = 0; i < 10; i++) initial.push({ id: ID(5000 + i), liked: true, count: 1 });
    var batches = [];
    for (var b = 0; b < 3; b++) {
      var page = [];
      for (var j = 0; j < 10; j++) page.push({ id: ID(5100 + b * 10 + j), liked: true, count: 2 });
      batches.push(page);
    }
    batches[2].push({ id: ID(5900), liked: false, count: 4 });   // the prize, at the bottom

    var s = setup({
      cards: initial, batches: batches,
      loadDelay: 1500,          // far slower than any skimming wait
      height: 240
    }, {
      scrollDelay: 300, fastForward: true, fastForwardAfter: 1,
      fastForwardMultiplier: 4, maxNoNewContentAttempts: 3,
      stopAfterConsecutiveAlreadyLiked: 0, pruneProcessedCards: false
    });

    var r = await s.engine.start();

    eq(s.mock.batchesLoaded, 3, 'every page was eventually loaded despite the slow feed');
    eq(s.mock.clicks[ID(5900)], 1, 'the post at the very bottom was reached and liked');
    eq(r.stats.newLikes, 1, 'exactly one new like');
    eq(r.reason, 'END_OF_FEED', 'and it ended only once the feed was genuinely exhausted');

  test('32. Fast-forward jumps further the longer a dead stretch runs', async function () {
    var cards = [];
    for (var i = 0; i < 200; i++) cards.push({ id: ID(6000 + i), liked: true, count: 1 });

  test('33. Diagnostics report whether the feed can be jumped into', function () {
    var s = setup({ cards: [{ id: ID(7000), liked: false, count: 1 }] });
    var report = s.engine.diagnose();
    assert(!!report.pagination, 'a pagination section is reported');
    ['pageLinks', 'nextLinks', 'loadMore', 'cursorAttributes', 'urlParams'].forEach(function (k) {
      assert(Array.isArray(report.pagination[k]), 'pagination.' + k + ' is reported');

  /* =================================================================== */
  /* PAGINATED FEED - jump straight to a page instead of scrolling         */
  /* =================================================================== */

  var PAGES = window.RecognizePagination;
  // The real markup, taken from a live Recognize grid.
  var REAL_URL = 'https://recognizeapp.com/banglalink.net/grid' +
    '?animate=false&filter_by%5B%5D=anniversary&filter_by%5B%5D=recognition';

  function paginationFixture(currentPage, opts) {
    opts = opts || {};
    var holder = document.createElement('div');
    stage.appendChild(holder);
    var base = currentPage > 1 ? REAL_URL + '&page=' + currentPage : REAL_URL;
    var html = '<div class="pagination">';
    (opts.pages || [2, 3, 4, 73, 1791, 1792]).forEach(function (p) {
      html += '<a href="' + REAL_URL + '&page=' + p + '">' + p + '</a>';
    });
    if (opts.next !== null) {
      html += '<a class="next_page" href="' + REAL_URL + '&page=' +
              (opts.next || currentPage + 1) + '">Next &rsaquo;</a>';
    }
    html += '</div>';
    holder.innerHTML = html;
    // A stand-in document whose location is the page we are pretending to be on.
    var fakeWin = { location: { href: base } };
    var fakeDoc = {
      querySelector: function (sel) { return holder.querySelector(sel); },
      querySelectorAll: function (sel) { return holder.querySelectorAll(sel); },
      location: { href: base }
    };
    return { doc: fakeDoc, win: fakeWin, holder: holder, href: base };
  }

  test('34. Reads the real Recognize pagination markup', function () {
    var f = paginationFixture(72, { next: 73 });
    var info = PAGES.parsePageInfo(f.doc, f.win);
    eq(info.current, 72, 'current page read from the URL');
    eq(info.next, 73, 'next page read from a.next_page');
    eq(info.paginated, true, 'the feed is recognised as paginated');
    eq(info.last, 1792, 'the last page is read from the pagination block');
    assert(info.nextUrl.indexOf('page=73') >= 0, 'next url points at page 73');
    // The filters must survive, or the next page is a different feed.
    assert(info.nextUrl.indexOf('filter_by') >= 0, 'filters preserved: ' + info.nextUrl);
  });

  test('35. Page 1 has no page parameter, and URLs keep every filter', function () {
    var f = paginationFixture(1, { next: 2 });
    eq(PAGES.parsePageInfo(f.doc, f.win).current, 1, 'a URL with no page param is page 1');

    var built = PAGES.urlForPage(REAL_URL + '&page=72', 73);
    eq(PAGES.pageOf(built), 73, 'page swapped');
    eq(built.indexOf('filter_by%5B%5D=anniversary') >= 0, true, 'first filter kept');
    eq(built.indexOf('filter_by%5B%5D=recognition') >= 0, true, 'second filter kept');
    eq(built.indexOf('animate=false') >= 0, true, 'other params kept');
    eq((built.match(/page=/g) || []).length, 1, 'no duplicated page parameter');

    var fresh = PAGES.urlForPage(REAL_URL, 5);
    eq(PAGES.pageOf(fresh), 5, 'a page param is added when there was none');
    eq(fresh.indexOf('filter_by') >= 0, true, 'and the filters are still there');
  });

  /** Drives the runner with a fake engine and fake navigation. */
  function runnerHarness(opts) {
    opts = opts || {};
    var page = opts.startPage || 72;
    var perPage = opts.likesPerPage || function () { return 2; };
    var store = { value: null };
    var navigations = [];
    var enginePages = [];
    var f;

    function buildFor(p) { f = paginationFixture(p, { next: opts.lastPage && p >= opts.lastPage ? null : p + 1 }); }
    buildFor(page);

    var runner = PAGES.createPageRunner({
      get doc() { return f.doc; },
      get win() { return f.win; },
      storage: {
        get: function () { return Promise.resolve(store.value); },
        set: function (v) { store.value = JSON.parse(JSON.stringify(v)); return Promise.resolve(); }
      },
      navigate: function (url) {
        navigations.push(url);
        page = PAGES.pageOf(url);
        buildFor(page);                                  // "the browser loaded it"
      },
      runEngine: function (settings) {
        enginePages.push({ page: page, settings: settings });
        var n = perPage(page);
        return Promise.resolve({
          reason: 'PAGE_DONE',
          stats: { newLikes: n, alreadyLiked: 14 - n, skipped: 0, errors: 0, scanned: 14 }
        });
      }
    });

    return {
      runner: runner, store: store, navigations: navigations, enginePages: enginePages,
      currentPage: function () { return page; },
      resumeUntilDone: async function (max) {
        for (var i = 0; i < (max || 20); i++) {
          if (store.value && !store.value.active) break;
          await runner.resume();
        }
      }
    };
  }

  test('35b. Pagination hidden by the site\'s CSS is still usable', function () {
    // Infinite-scroll scripts commonly render the pagination and then hide it,
    // so "there are no page numbers at the bottom" says nothing about whether
    // the pages exist. querySelector does not care about visibility, and
    // neither should we.
    var holder = document.createElement('div');
    stage.appendChild(holder);
    holder.innerHTML =
      '<style>.hidden-pag{display:none}</style>' +
      '<div class="pagination hidden-pag">' +
      '  <a href="' + REAL_URL + '&page=2">2</a>' +
      '  <a href="' + REAL_URL + '&page=1792">1792</a>' +
      '  <a class="next_page" href="' + REAL_URL + '&page=73">Next</a>' +
      '</div>';

    var pag = holder.querySelector('.pagination');
    eq(getComputedStyle(pag).display, 'none', 'the pagination really is hidden from view');

    var fakeWin = { location: { href: REAL_URL } };
    var fakeDoc = {
      querySelector: function (sel) { return holder.querySelector(sel); },
      querySelectorAll: function (sel) { return holder.querySelectorAll(sel); },
      location: { href: REAL_URL }
    };
    var info = PAGES.parsePageInfo(fakeDoc, fakeWin);
    eq(info.paginated, true, 'it is still recognised as paginated');
    eq(info.next, 73, 'the next page is still read');
    eq(info.last, 1792, 'the last page is still read');
    assert(info.nextUrl.indexOf('filter_by') >= 0, 'and the filters still survive');
  });

  test('36. Walks page to page, carrying totals across each navigation', async function () {
    var h = runnerHarness({ startPage: 72, likesPerPage: function () { return 3; } });
    await h.runner.start({ maxLikesPerRun: 12, stopAfterEmptyPages: 5 });
    await h.resumeUntilDone();

    eq(h.store.value.lastReason, 'MAX_LIKES_REACHED', 'it stopped at the like budget');
    eq(h.store.value.totals.newLikes, 12, 'totals accumulated across pages');
    eq(h.store.value.pagesDone, 4, 'four pages at three likes each');
    eq(h.navigations.length, 3, 'three navigations between four pages');
    assert(h.navigations[0].indexOf('page=73') >= 0, 'first hop went to page 73: ' + h.navigations[0]);
    assert(h.navigations.every(function (u) { return u.indexOf('filter_by') >= 0; }),
      'every hop kept the filters');
    eq(h.enginePages.every(function (e) { return e.settings.scrollForMore === false; }), true,
      'the engine was told not to scroll for more on any page');
  });

  test('37. Stops after enough pages with nothing new (caught up)', async function () {
    var h = runnerHarness({ startPage: 100, likesPerPage: function () { return 0; } });
    await h.runner.start({ maxLikesPerRun: 500, stopAfterEmptyPages: 3 });
    await h.resumeUntilDone();

    eq(h.store.value.lastReason, 'CAUGHT_UP', 'it concluded it is caught up');
    eq(h.store.value.pagesDone, 3, 'after three empty pages');
    eq(h.store.value.totals.newLikes, 0, 'having liked nothing');
  });

  test('38. A run resumes on the page it left off at', async function () {
    var h = runnerHarness({ startPage: 72, likesPerPage: function () { return 1; } });
    await h.runner.start({ maxLikesPerRun: 100, stopAfterEmptyPages: 5 });

    // One hop has happened; this is what storage would hold across a reload.
    eq(h.store.value.active, true, 'the run is still marked active');
    eq(h.store.value.page, 73, 'and records page 73 as where to continue');
    eq(h.currentPage(), 73, 'the browser is on page 73');

    // Simulate the content script being rebuilt by the navigation.
    await h.runner.resume();
    eq(h.store.value.page, 74, 'resuming carried it on to page 74');
    eq(h.store.value.totals.newLikes, 2, 'and the earlier page total was not lost');
  });

  test('39. Stops at the last page instead of running off the end', async function () {
    var h = runnerHarness({ startPage: 1791, lastPage: 1792, likesPerPage: function () { return 1; } });
    await h.runner.start({ maxLikesPerRun: 100, stopAfterEmptyPages: 5 });
    await h.resumeUntilDone();

    eq(h.store.value.lastReason, 'END_OF_FEED', 'it stopped when there was no next page');
    assert(h.store.value.pagesDone <= 2, 'after the final page or two');
  });

  test('40. STOP ends a paginated run and it does not resume', async function () {
    var h = runnerHarness({ startPage: 72, likesPerPage: function () { return 1; } });
    await h.runner.start({ maxLikesPerRun: 100, stopAfterEmptyPages: 5 });
    await h.runner.stop('STOPPED_BY_USER');

    eq(h.store.value.active, false, 'the run is no longer active');
    var hops = h.navigations.length;
    await h.runner.resume();
    eq(h.navigations.length, hops, 'resuming after STOP navigates nowhere');
  });

  /* =================================================================== */
  /* BACKGROUND-TAB CATCH-UP                                              */
  /* =================================================================== */

  test('25. nudge() settles overdue waits but never shortens a live one', async function () {
    var s = setup({ cards: [
      { id: ID(800), liked: false, count: 0 },
      { id: ID(801), liked: false, count: 0 }
    ] }, { clickDelay: 4000, minPostClickDelay: 4000, maxPostClickDelay: 4000 });

    s.engine.start();
    await wait(300);

    // A wait is in flight and nowhere near due: nudge must leave it alone.
    assert(s.engine.pendingWaits() > 0, 'a wait is in flight');
    var early = s.engine.nudge();
    eq(early.caughtUp, 0, 'nothing was settled early');
    eq(s.mock.totalClicks, 0, 'and no click was brought forward');

    s.engine.stop('test cleanup');
    await s.engine.waitForIdle();
    assertNoDamage(s.mock);
  });

  test('26. nudge() reports what it caught up, and a run still completes', async function () {
    var s = setup({ cards: [
      { id: ID(810), liked: false, count: 3 },
      { id: ID(811), liked: true, count: 1 },
      { id: ID(812), liked: false, count: 0 }
    ] });
    // Ping it the way the service worker does, throughout the run.
    var pinger = setInterval(function () { s.engine.nudge(); }, 40);
    try {
      var r = await s.engine.start();
      eq(r.stats.newLikes, 2, 'the run completed normally while being pinged');
      eq(r.stats.alreadyLiked, 1, 'and still skipped the already-liked one');
    } finally {
      clearInterval(pinger);
    }
    eq(s.engine.nudge().caughtUp, 0, 'nothing left pending once stopped');
    assertNoDamage(s.mock);
  });

  /* =================================================================== */
  var results = [];
  async function run() {
    for (var i = 0; i < TESTS.length; i++) {
      var t = TESTS[i];
      var started = Date.now();
      var li = document.createElement('li');
      resultsEl.appendChild(li);
      try {
        await t.fn();
        var ms = Date.now() - started;
        li.innerHTML = '<span class="ok">PASS</span> ' + t.name + ' <span class="ms">(' + ms + 'ms)</span>';
        results.push({ name: t.name, ok: true });
      } catch (err) {
        li.innerHTML = '<span class="no">FAIL</span> ' + t.name +
          '<span class="why">' + String(err && err.message) + '</span>';
        results.push({ name: t.name, ok: false, error: String(err && err.message) });
      }
    }
    var failed = results.filter(function (r) { return !r.ok; }).length;
    summaryEl.textContent = (results.length - failed) + ' / ' + results.length + ' passed';
    summaryEl.className = failed ? 'fail' : 'pass';
    window.__testResults = { total: results.length, failed: failed, results: results };
    window.__testsDone = true;
  }

  run();
})();
