<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock RecognizeApp feed</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         margin: 0; padding: 20px; background: #eef1f6; color: #22293a; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { color: #667089; margin: 0 0 16px; }
  .topnav { display: flex; gap: 14px; align-items: center; background: #2a3346; color: #fff;
            padding: 9px 14px; border-radius: 8px 8px 0 0; }
  .topnav a { color: #cfe0ff; text-decoration: none; }
  a.approval_link { display: inline-block; min-width: 34px; text-align: center; padding: 3px 9px;
    border-radius: 5px; border: 1px solid #b9c2d6; text-decoration: none; color: #22293a;
    background: #f5f7fb; font-weight: 700; }
  a.approval_link.approved { background: #2f8f5b; border-color: #2f8f5b; color: #fff; }
  .loader { text-align: center; padding: 12px; color: #66708a; font-style: italic; }
  .recognition-feed { margin: 0; padding: 0; }
  pre { background: #fff; border: 1px solid #d6dbe6; border-radius: 8px; padding: 10px;
        font-size: 12px; overflow: auto; }
</style>
</head>
<body>
  <h1>Mock RecognizeApp feed</h1>
  <p class="sub">
    A safe stand-in for the real feed: liked and unliked cards, misleading “+N” totals,
    decoy controls, an inner scroll container and lazily loaded batches.
    Clicking an already-approved control here really does remove the like, so mistakes are visible.
  </p>

  <div id="feed"></div>

  <h2 style="font-size:14px;">Live state</h2>
  <pre id="state">—</pre>

<script src="mock-feed.js"></script>
<script>
  var ID = MockFeed.id;
  var cards = [];
  // 20 cards: mixed liked/unliked, and totals that deliberately mislead.
  for (var i = 1; i <= 20; i++) {
    cards.push({ id: ID(i), liked: i % 3 === 0, count: (i * 3) % 8 });
  }
  var mock = MockFeed.build(document.getElementById('feed'), {
    cards: cards,
    batches: [
      [{ id: ID(90), liked: false, count: 2 }, { id: ID(91), liked: true, count: 4 }],
      [{ id: ID(92), liked: false, count: 7 }, { id: ID(93), liked: false, count: 0 }]
    ],
    height: 420, slow: 120, loadDelay: 500
  });
  window.mock = mock;

  setInterval(function () {
    document.getElementById('state').textContent = JSON.stringify({
      unlikedRemaining: mock.unlikedCount(),
      likedNow: mock.likedCount(),
      clicks: mock.totalClicks,
      batchesLoaded: mock.batchesLoaded,
      forbiddenClicks: mock.forbiddenClicks,
      likesRemovedByAutomation: mock.unlikedByAutomation
    }, null, 2);
  }, 400);
</script>
</body>
</html>
